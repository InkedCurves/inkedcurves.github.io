
<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Galleria di illustrazioni a inchiostro di Inked Curves.">
  <title>Gallery — Inked Curves</title>
  <link rel="stylesheet" href="style.css">

  <style>
    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 18px;
      margin-top: 28px;
    }

    .artwork-card {
      min-width: 0;
      text-align: center;
    }

    .artwork-image-button {
      display: block;
      width: 100%;
      padding: 0;
      border: 0;
      background: transparent;
      cursor: pointer;
    }

    .artwork-image-button img {
      display: block;
      width: 100%;
      height: auto;
      object-fit: contain;
      background: #fff;
    }

    .artwork-name {
      margin: 10px 0 5px;
      font-size: 14px;
    }

    .artwork-name a,
    .artwork-model-link {
      color: inherit;
      text-decoration: underline;
      text-underline-offset: 3px;
    }

    .artwork-actions {
      margin-top: 10px;
    }

    .copy-artwork-link {
      padding: 8px 10px;
      border: 1px solid currentColor;
      background: transparent;
      color: inherit;
      font: inherit;
      font-size: 12px;
      cursor: pointer;
    }

    /* LIKE NELLA GALLERIA */
    .like-area {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 7px;
      margin: 12px 0;
    }

    .like-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 7px 12px;
      border: 1px solid currentColor;
      border-radius: 30px;
      background: transparent;
      color: inherit;
      font: inherit;
      font-size: 15px;
      cursor: pointer;
      white-space: nowrap;
    }

    .like-button .heart {
      font-size: 20px;
      line-height: 1;
    }

    .like-button.liked {
      color: #e34b65;
      border-color: #e34b65;
    }

    .like-button:disabled {
      cursor: default;
      opacity: 0.8;
    }

    .like-count {
      font-size: 13px;
      opacity: 0.8;
    }

    .gallery-message {
      padding: 25px 0;
      text-align: center;
    }

    /* LIGHTBOX */
    .lightbox {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: rgba(0, 0, 0, 0.96);
      padding: 65px 52px 145px;
      box-sizing: border-box;
    }

    .lightbox.is-open {
      display: flex;
    }

    .lightbox-image {
      display: block;
      max-width: 100%;
      max-height: 100%;
      width: auto;
      height: auto;
      object-fit: contain;
    }

    .lightbox-close,
    .lightbox-prev,
    .lightbox-next {
      position: absolute;
      z-index: 2;
      border: 0;
      background: rgba(30, 30, 30, 0.85);
      color: #fff;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .lightbox-close {
      top: 12px;
      right: 14px;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      font-size: 30px;
    }

    .lightbox-prev,
    .lightbox-next {
      top: 50%;
      transform: translateY(-50%);
      width: 42px;
      height: 54px;
      border-radius: 5px;
      font-size: 28px;
    }

    .lightbox-prev {
      left: 6px;
    }

    .lightbox-next {
      right: 6px;
    }

    .lightbox-counter {
      position: absolute;
      top: 23px;
      left: 50%;
      transform: translateX(-50%);
      color: #fff;
      font-size: 12px;
    }

    /* LIKE CENTRALE SOTTO IL DISEGNO */
    .lightbox-like-area {
      position: absolute;
      bottom: 115px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      flex-direction: row;
      justify-content: center;
      align-items: center;
      gap: 10px;
      width: auto;
      max-width: 95%;
      margin: 0;
      z-index: 10;
      white-space: nowrap;
    }

    .lightbox-like-area .like-button {
      display: inline-flex;
      flex-direction: row;
      align-items: center;
      justify-content: center;
      gap: 8px;
      min-width: 145px;
      padding: 12px 20px;
      border: 1px solid #fff;
      border-radius: 30px;
      color: #fff;
      background: rgba(20, 20, 20, 0.95);
      font-size: 17px;
      white-space: nowrap;
    }

    .lightbox-like-area .like-button span {
      display: inline-block;
      white-space: nowrap;
    }

    .lightbox-like-area .like-button.liked {
      color: #ff647d;
      border-color: #ff647d;
    }

    .lightbox-like-area .like-button .heart {
      font-size: 24px;
      line-height: 1;
    }

    .lightbox-like-area .like-count {
      display: none;
      color: #fff;
      font-size: 15px;
      white-space: nowrap;
    }

    @media (max-width: 480px) {
      .gallery-grid {
        gap: 12px;
      }

      .lightbox {
        padding: 65px 38px 145px;
      }

      .lightbox-prev {
        left: 2px;
      }

      .lightbox-next {
        right: 2px;
      }

      .lightbox-like-area {
        bottom: 95px;
        max-width: 95%;
      }

      .lightbox-like-area .like-button {
        min-width: 145px;
        padding: 12px 16px;
        font-size: 16px;
      }
    }
  </style>
</head>

<body>
  <header class="site-header">
    <div class="container nav">
      <a class="logo" href="index.html">INKED CURVES</a>

      <button class="menu-toggle" aria-label="Apri il menu"
        aria-expanded="false">
        ☰
      </button>

      <nav class="nav-links">
        <a href="index.html">Home</a>
        <a href="gallery.html">Gallery</a>
        <a href="artist.html">L'artista</a>
        <a href="contacts.html">Contatti</a>
      </nav>
    </div>
  </header>

  <main class="container page">
    <section class="page-intro">
      <p class="eyebrow">ILLUSTRAZIONE · CORPO · INCHIOSTRO</p>
      <h1>Selected works</h1>
      <p>
        Una selezione di disegni, tratti e suggestioni.
        Tocca un'opera per aprirla e condividerne il link diretto.
      </p>
    </section>

    <div id="gallery-message" class="gallery-message">
      Caricamento delle opere...
    </div>

    <section id="gallery-grid" class="gallery-grid"
      aria-label="Galleria delle opere"></section>
  </main>

  <div id="lightbox" class="lightbox"
    role="dialog" aria-modal="true" aria-label="Opera ingrandita">

    <button id="lightbox-close" class="lightbox-close"
      aria-label="Chiudi">×</button>

    <button id="lightbox-prev" class="lightbox-prev"
      aria-label="Opera precedente">‹</button>

    <img id="lightbox-image" class="lightbox-image" src=""
      alt="Illustrazione ingrandita">

    <button id="lightbox-next" class="lightbox-next"
      aria-label="Opera successiva">›</button>

    <div id="lightbox-counter" class="lightbox-counter"></div>

    <div id="lightbox-like-area" class="like-area lightbox-like-area"></div>
  </div>

  <script>
    const USER = "InkedCurves";
    const REPO = "inkedcurves.github.io";
    const BRANCH = "main";

    const SUPABASE_URL =
      "https://umbfkdqumqywqstsravi.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable_wQkyv-chm52CaGbVD-clfQ_wek5l_JS";

    const galleryGrid = document.getElementById("gallery-grid");
    const galleryMessage = document.getElementById("gallery-message");
    const lightbox = document.getElementById("lightbox");
    const lightboxImage = document.getElementById("lightbox-image");
    const lightboxCounter = document.getElementById("lightbox-counter");
    const lightboxLikeArea =
      document.getElementById("lightbox-like-area");

    let artworks = [];
    let currentIndex = -1;

    const likeStates = new Map();

    const imageExtensions = /\.(jpe?g|png|webp|gif|avif)$/i;

    function rawImageUrl(path) {
      return "https://raw.githubusercontent.com/" +
        USER + "/" + REPO + "/" + BRANCH + "/" +
        path.split("/").map(encodeURIComponent).join("/");
    }

    function getArtworkLink(artwork) {
      const url = new URL("gallery.html", window.location.href);
      url.searchParams.set("opera", artwork.path);
      return url.href;
    }

    async function copyArtworkLink(artwork) {
      const link = getArtworkLink(artwork);

      try {
        await navigator.clipboard.writeText(link);
        return true;
      } catch (error) {
        window.prompt("Copia questo link:", link);
        return false;
      }
    }

    async function loadModelle() {
      try {
        const response = await fetch(
          "https://raw.githubusercontent.com/" +
          USER + "/" + REPO + "/" + BRANCH + "/modelle.json"
        );

        if (!response.ok) return {};

        return await response.json();
      } catch (error) {
        return {};
      }
    }

    async function loadDirectory(path) {
      const endpoint =
        "https://api.github.com/repos/" + USER + "/" + REPO +
        "/contents/" + path + "?ref=" + BRANCH;

      const response = await fetch(endpoint);

      if (!response.ok) return [];

      const items = await response.json();

      if (!Array.isArray(items)) return [];

      return items.filter(item =>
        item.type === "file" &&
        imageExtensions.test(item.name)
      );
    }

    function findModelInfo(modelle, artwork) {
      return modelle[artwork.path] ||
        modelle[artwork.name] ||
        modelle[artwork.path.replace(/^gallery\//, "")] ||
        {};
    }

    function getStorageKey(path) {
      return "inkedcurves-liked-" + path;
    }

    function createLikeState(path) {
      const state = {
        likes: 0,
        liked: localStorage.getItem(getStorageKey(path)) === "yes",
        loading: true,
        controls: []
      };

      likeStates.set(path, state);

      getLikes(path).then(likes => {
        state.likes = likes;
        state.loading = false;
        updateLikeControls(state);
      });

      return state;
    }

    async function getLikes(artworkPath) {
      try {
        const url = SUPABASE_URL +
          "/rest/v1/artwork_likes" +
          "?select=likes&artwork_path=eq." +
          encodeURIComponent(artworkPath);

        const response = await fetch(url, {
          headers: {
            "apikey": SUPABASE_KEY,
            "Authorization": "Bearer " + SUPABASE_KEY
          }
        });

        if (!response.ok) {
          throw new Error("Errore nel recupero dei like");
        }

        const data = await response.json();

        return data.length ? Number(data[0].likes) || 0 : 0;
      } catch (error) {
        console.error(error);
        return 0;
      }
    }

    async function sendLike(artworkPath) {
      const response = await fetch(
        SUPABASE_URL + "/rest/v1/rpc/increment_artwork_like",
        {
          method: "POST",
          headers: {
            "apikey": SUPABASE_KEY,
            "Authorization": "Bearer " + SUPABASE_KEY,
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            p_artwork_path: artworkPath
          })
        }
      );

      if (!response.ok) {
        throw new Error("Impossibile registrare il like");
      }

      return Number(await response.json());
    }

    function updateLikeControls(state) {
      state.controls.forEach(control => {
        control.button.classList.toggle("liked", state.liked);
        control.heart.textContent = state.liked ? "♥" : "♡";
        control.label.textContent = state.liked
          ? "Ti piace"
          : "Mi piace";

        control.count.textContent = state.loading
          ? "…"
          : state.likes;

        control.button.disabled = state.liked || state.loading;
      });
    }

    async function handleLike(path) {
      const state = likeStates.get(path);

      if (!state || state.liked || state.loading) return;

      state.loading = true;
      updateLikeControls(state);

      try {
        const newLikes = await sendLike(path);

        state.likes = newLikes;
        state.liked = true;
        localStorage.setItem(getStorageKey(path), "yes");
      } catch (error) {
        console.error(error);
        alert("Non è stato possibile registrare il like. Riprova.");
      }

      state.loading = false;
      updateLikeControls(state);
    }

    function createLikeControl(path, area) {
      const state = likeStates.get(path);

      const button = document.createElement("button");
      button.className = "like-button";
      button.type = "button";

      const heart = document.createElement("span");
      heart.className = "heart";

      const label = document.createElement("span");

      const count = document.createElement("span");
      count.className = "like-count";

      button.appendChild(heart);
      button.appendChild(label);
      area.appendChild(button);
      area.appendChild(count);

      const control = { button, heart, label, count };
      state.controls.push(control);

      button.addEventListener("click", () => handleLike(path));

      updateLikeControls(state);

      return control;
    }

    function createArtworkCard(artwork, index, modelle) {
      const card = document.createElement("article");
      card.className = "artwork-card";

      const imageButton = document.createElement("button");
      imageButton.className = "artwork-image-button";
      imageButton.type = "button";
      imageButton.setAttribute("aria-label", "Apri " + artwork.name);

      const image = document.createElement("img");
      image.src = artwork.url;
      image.alt = artwork.name.replace(/\.[^.]+$/, "");
      image.loading = "lazy";

      imageButton.appendChild(image);
      imageButton.addEventListener("click", () => openLightbox(index));

      card.appendChild(imageButton);

      const info = findModelInfo(modelle, artwork);
      const name = document.createElement("p");
      name.className = "artwork-name";

      name.textContent = info.nome ||
        artwork.name.replace(/\.[^.]+$/, "");

      card.appendChild(name);

      if (info.instagram) {
        const instagram = document.createElement("a");
        instagram.className = "artwork-model-link";
        instagram.href = info.instagram;
        instagram.target = "_blank";
        instagram.rel = "noopener noreferrer";
        instagram.textContent = "Instagram della modella";
        card.appendChild(instagram);
      }

      const likeArea = document.createElement("div");
      likeArea.className = "like-area";
      card.appendChild(likeArea);

      createLikeControl(artwork.path, likeArea);

      const actions = document.createElement("div");
      actions.className = "artwork-actions";

      const copyButton = document.createElement("button");
      copyButton.className = "copy-artwork-link";
      copyButton.type = "button";
      copyButton.textContent = "Copia link dell'opera";

      copyButton.addEventListener("click", async () => {
        await copyArtworkLink(artwork);
        copyButton.textContent = "Link pronto";

        window.setTimeout(() => {
          copyButton.textContent = "Copia link dell'opera";
        }, 1800);
      });

      actions.appendChild(copyButton);
      card.appendChild(actions);

      return card;
    }

    function openLightbox(index, updateAddress = true) {
      if (!artworks.length) return;

      currentIndex = (index + artworks.length) % artworks.length;

      const artwork = artworks[currentIndex];

      lightboxImage.src = artwork.url;
      lightboxImage.alt = artwork.name.replace(/\.[^.]+$/, "");

      lightboxCounter.textContent =
        (currentIndex + 1) + " / " + artworks.length;

      lightboxLikeArea.innerHTML = "";
      createLikeControl(artwork.path, lightboxLikeArea);

      lightbox.classList.add("is-open");
      document.body.style.overflow = "hidden";

      if (updateAddress) {
        const url = new URL(window.location.href);
        url.searchParams.set("opera", artwork.path);
        history.replaceState({ artworkOpen: true }, "", url);
      }
    }

    function closeLightbox(updateAddress = true) {
      lightbox.classList.remove("is-open");
      document.body.style.overflow = "";
      lightboxImage.src = "";
      lightboxLikeArea.innerHTML = "";
      currentIndex = -1;

      if (updateAddress) {
        const url = new URL(window.location.href);
        url.searchParams.delete("opera");
        history.replaceState({}, "", url.pathname + url.search + url.hash);
      }
    }

    function showNext() {
      if (currentIndex >= 0) {
        openLightbox(currentIndex + 1);
      }
    }

    function showPrevious() {
      if (currentIndex >= 0) {
        openLightbox(currentIndex - 1);
      }
    }

    document.getElementById("lightbox-close")
      .addEventListener("click", () => closeLightbox());

    document.getElementById("lightbox-next")
      .addEventListener("click", showNext);

    document.getElementById("lightbox-prev")
      .addEventListener("click", showPrevious);

    lightbox.addEventListener("click", event => {
      if (event.target === lightbox) closeLightbox();
    });

    document.addEventListener("keydown", event => {
      if (!lightbox.classList.contains("is-open")) return;

      if (event.key === "Escape") closeLightbox();
      if (event.key === "ArrowRight") showNext();
      if (event.key === "ArrowLeft") showPrevious();
    });

    async function initGallery() {
      try {
        const [rootFiles, galleryFiles, modelle] = await Promise.all([
          loadDirectory(""),
          loadDirectory("gallery"),
          loadModelle()
        ]);

        const allFiles = [...rootFiles, ...galleryFiles];

        artworks = allFiles
          .filter(file => file.name !== "modelle.json")
          .map(file => ({
            name: file.name,
            path: file.path,
            url: rawImageUrl(file.path)
          }))
          .sort((a, b) => a.name.localeCompare(b.name, "it"));

        if (!artworks.length) {
          galleryMessage.textContent =
            "Non è stato possibile trovare immagini nella galleria.";
          return;
        }

        artworks.forEach(artwork => {
          createLikeState(artwork.path);
        });

        galleryMessage.style.display = "none";

        artworks.forEach((artwork, index) => {
          galleryGrid.appendChild(
            createArtworkCard(artwork, index, modelle)
          );
        });

        const params = new URLSearchParams(window.location.search);
        const requestedArtwork = params.get("opera");

        if (requestedArtwork) {
          const index = artworks.findIndex(artwork =>
            artwork.path === requestedArtwork ||
            artwork.name === requestedArtwork
          );

          if (index !== -1) {
            openLightbox(index, false);
          }
        }
      } catch (error) {
        console.error(error);
        galleryMessage.textContent =
          "Errore nel caricamento della galleria. Riprova più tardi.";
      }
    }

    const menuToggle = document.querySelector(".menu-toggle");
    const navLinks = document.querySelector(".nav-links");

    if (menuToggle && navLinks) {
      menuToggle.addEventListener("click", () => {
        const isOpen = navLinks.classList.toggle("active");
        menuToggle.setAttribute("aria-expanded", String(isOpen));
      });
    }

    initGallery();
  </script>
</body>
</html>
